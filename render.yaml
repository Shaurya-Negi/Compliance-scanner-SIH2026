services:
  # FastAPI Web Service on Render
  - type: web
    name: sih2026-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: sih2026-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: CORS_ORIGINS
        value: "https://sih2026-scanner.vercel.app,http://localhost:5173"

databases:
  # Managed PostgreSQL Free Tier
  - name: sih2026-postgres
    plan: free
    region: oregon
    databaseName: sih2026
    user: sih_admin
